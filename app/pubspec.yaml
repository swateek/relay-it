name: relayit
description: "Relayit - offline Android SMS forwarder."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  hive_flutter: ^1.1.0
  go_router: ^17.2.3
  telephony: ^0.2.0
  flutter_foreground_task: ^9.2.2
  url_launcher: ^6.3.2
  flutter_email_sender: ^8.0.0
  permission_handler: ^12.0.1
  google_fonts: ^8.1.0
  uuid: ^4.5.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
